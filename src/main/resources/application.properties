# ─────────────────────────────────────────────
# ElevenLabs API key — set via environment variable:
#   export ELEVEN_LABS_API_KEY=your_key_here
# ─────────────────────────────────────────────
spring.ai.elevenlabs.api-key=${ELEVEN_LABS_API_KEY}

# Voice: "Adam" — a clear, neutral male voice (free-tier available)
# Replace with any voice ID from your ElevenLabs account.
# Browse voices at: https://elevenlabs.io/voice-library
spring.ai.elevenlabs.tts.voice-id=pNInz6obpgDQGcFmaJgB

# Model: eleven_turbo_v2_5 — fast, high-quality, supports all languages
spring.ai.elevenlabs.tts.model=eleven_turbo_v2_5

# Output format: MP3 at 44.1 kHz, 128 kbps
spring.ai.elevenlabs.tts.output-format=mp3_44100_128

# Ongifier output settings
ongifier.output-file=output.mp3
ongifier.auto-play=true

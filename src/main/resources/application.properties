# ─────────────────────────────────────────────────────────────────────────────
# TTS Provider Selection
#
# Set ongifier.tts.provider to either:
#   elevenlabs   (default)
#   openai
#
# Only the credentials for the chosen provider need to be set.
# ─────────────────────────────────────────────────────────────────────────────
ongifier.tts.provider=elevenlabs

# ─────────────────────────────────────────────
# ElevenLabs API key — set via environment variable:
#   export ELEVEN_LABS_API_KEY=your_key_here
# ─────────────────────────────────────────────
spring.ai.elevenlabs.api-key=${ELEVEN_LABS_API_KEY}

# Voice: "Adam" — a clear, neutral male voice (free-tier available)
# Replace with any voice ID from your ElevenLabs account.
# Browse voices at: https://elevenlabs.io/voice-library

# Sounds like my neighbor Reneé
spring.ai.elevenlabs.tts.voice-id=pNInz6obpgDQGcFmaJgB

###############################################
# TTS settings

# Model: eleven_turbo_v2_5 — fast, high-quality, supports all languages
spring.ai.elevenlabs.tts.model=eleven_turbo_v2_5

# Output format: MP3 at 44.1 kHz, 128 kbps
spring.ai.elevenlabs.tts.output-format=mp3_44100_128

# ─────────────────────────────────────────────────────────────────────────────
# OpenAI — active when ongifier.tts.provider=openai
#   export OPENAI_API_KEY=your_key_here
# ─────────────────────────────────────────────────────────────────────────────
spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}

# tts-1 = standard latency, tts-1-hd = higher quality
spring.ai.openai.audio.speech.model=tts-1

# Available voices: alloy, echo, fable, onyx, nova, shimmer
spring.ai.openai.audio.speech.voice=onyx

# Output format: mp3, opus, aac, flac
spring.ai.openai.audio.speech.response-format=mp3

# Speed: 0.25 – 4.0  (1.0 = normal)
spring.ai.openai.audio.speech.speed=1.0

# Suppress unused auto-configuration warnings for non-TTS OpenAI features
spring.ai.openai.chat.enabled=false
spring.ai.openai.embedding.enabled=false
spring.ai.openai.image.enabled=false
spring.ai.openai.audio.transcription.enabled=false
spring.ai.openai.moderation.enabled=false

# ─────────────────────────────────────────────────────────────────────────────
# General output settings
# ─────────────────────────────────────────────────────────────────────────────
ongifier.output-file=output.mp3
ongifier.auto-play=true
